{% extends 'workers/base.html' %}

{% block title %}{% if worklog %}Edit{% else %}Add{% endif %} Work Log{% endblock %}

{% block content %}
    <h1>{% if worklog %}✏️ Edit{% else %}➕ Add{% endif %} Work Log</h1>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Site:</label>
            <select name="site" required>
                <option value="">Select Site</option>
                {% for site in sites %}
                    <option value="{{ site.id }}" {% if worklog and worklog.site.id == site.id %}selected{% endif %}>
                        {{ site.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Work Done Today:</label>
            <textarea name="work_done" rows="4" cols="50" required>{{ worklog.work_done|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label>Pending Work:</label>
            <textarea name="pending_work" rows="3" cols="50">{{ worklog.pending_work|default:'' }}</textarea>
        </div>
        
        <!-- ===== NEW: Workers who worked ===== -->
        <div class="form-group">
            <label>Workers Who Worked:</label>
            <select name="workers" multiple style="height:150px;">
                {% for worker in all_workers %}
                    <option value="{{ worker.id }}" 
                        {% if worklog and worker in worklog.workers.all %}selected{% endif %}>
                        {{ worker.name }} ({{ worker.site.name }})
                    </option>
                {% endfor %}
            </select>
            <small>Hold Ctrl to select multiple workers</small>
        </div>
        
        <div>
            <button type="submit" class="btn btn-save">💾 Save</button>
            <a href="{% url 'worklog_list' %}" class="btn-cancel">❌ Cancel</a>
        </div>
    </form>

    <style>
        .form-group {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 180px;
            font-weight: bold;
            vertical-align: top;
        }
        input, select, textarea {
            padding: 8px;
            width: 350px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        select[multiple] {
            width: 350px;
        }
        .btn {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-save {
            background: #4CAF50;
            color: white;
        }
        .btn-save:hover {
            background: #45a049;
        }
        .btn-cancel {
            background: #666;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            display: inline-block;
        }
        .btn-cancel:hover {
            background: #555;
        }
        small {
            color: #666;
            font-size: 12px;
            display: block;
            margin-top: 5px;
        }
    </style>
{% endblock %}
