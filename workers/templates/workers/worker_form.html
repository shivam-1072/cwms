{% extends 'workers/base.html' %}

{% block title %}{% if worker %}Edit{% else %}Add{% endif %} Worker{% endblock %}

{% block content %}
    <div class="form-wrapper">
    <h1>{% if worker %}✏️ Edit{% else %}➕ Add{% endif %} Worker</h1>

    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name" value="{{ worker.name|default:'' }}" required>
        </div>
        
        <div class="form-group">
            <label>Phone:</label>
            <input type="text" name="phone" value="{{ worker.phone|default:'' }}"
                   pattern="[0-9]{10}" maxlength="10"
                   title="Phone number must be exactly 10 digits" required>
        </div>
        
        <div class="form-group">
            <label>Joining Date:</label>
            <input type="date" name="joining_date" value="{{ worker.joining_date|date:'Y-m-d'|default:'' }}" required>
        </div>
        
        <div class="form-group">
            <label>Daily Wage:</label>
            <input type="number" step="0.01" name="daily_wage" value="{{ worker.daily_wage|default:'' }}" required>
        </div>
        
        <div class="form-group">
            <label>Site:</label>
            <select name="site" required>
                <option value="">Select Site</option>
                {% for site in sites %}
                    <option value="{{ site.id }}" {% if worker and worker.site.id == site.id %}selected{% endif %}>
                        {{ site.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <button type="submit" class="btn btn-save">💾 Save</button>
            <a href="{% url 'worker_list' %}" class="btn-cancel">❌ Cancel</a>
        </div>
    </form>
    </div>

    <style>

        .form-wrapper {
            text-align: center;
        }

        .form-group {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input, select {
            padding: 8px;
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-save {
            background: #4CAF50;
            color: white;
        }
        .btn-save:hover {
            background: #45a049;
        }
        .btn-cancel {
            background: #666;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            display: inline-block;
        }
        .btn-cancel:hover {
            background: #555;
        }
    </style>
{% endblock %}
