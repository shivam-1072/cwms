{% extends 'workers/base.html' %}

{% block title %}Mark Attendance{% endblock %}

{% block content %}
    <div class="form-wrapper">
    <h1>📝 Mark Attendance</h1>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Worker:</label>
            <select name="worker" required>
                <option value="">Select Worker</option>
                {% for worker in workers %}
                    <option value="{{ worker.id }}">{{ worker.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Date:</label>
            <input type="date" name="date" value="{{ today|date:'Y-m-d' }}">
        </div>
        <div class="form-group">
            <label>Status:</label>
            <select name="status">
                <option value="present">✅ Present</option>
                <option value="absent">❌ Absent</option>
                <option value="paid_leave">💰 Paid Leave</option>
                <option value="unpaid_leave">💸 Unpaid Leave</option>
            </select>
        </div>
	<div class="form-group">
    <label>Extra Wage (₹):</label>
    <input type="number" step="0.01" name="extra_wage" value="0" placeholder="e.g., 150 for far site">
    <small style="display:block;color:#888;font-size:12px;">Leave 0 for normal wage</small>
</div>
        <div>
            <button type="submit" class="btn btn-save">💾 Save</button>
            <a href="{% url 'attendance_list' %}" class="btn-cancel">❌ Cancel</a>
        </div>
    </form>
    </div>

    <style>

        .form-wrapper {
            text-align: center;
        }

        .form-group {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input, select {
            padding: 8px;
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-save {
            background: #4CAF50;
            color: white;
        }
        .btn-save:hover {
            background: #45a049;
        }
        .btn-cancel {
            background: #666;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            display: inline-block;
        }
        .btn-cancel:hover {
            background: #555;
        }
    </style>
{% endblock %}
