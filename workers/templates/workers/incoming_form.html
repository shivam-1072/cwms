{% extends 'workers/base.html' %}

{% block title %}Add Incoming Payment{% endblock %}

{% block content %}
    <div class="form-wrapper">
        <h1>💰 Add Incoming Payment</h1>

        <form method="post" class="centered-form">
            {% csrf_token %}
            <div class="form-group">
                <label>Site:</label>
                <select name="site" required>
                    <option value="">Select Site</option>
                    {% for site in sites %}
                        <option value="{{ site.id }}">{{ site.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Amount (₹):</label>
                <input type="number" step="0.01" name="amount" required>
            </div>
            <div class="form-group">
                <label>Description:</label>
                <input type="text" name="description" placeholder="e.g., 1st installment">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-save">💾 Save</button>
                <a href="{% url 'incoming_list' %}" class="btn-cancel">❌ Cancel</a>
            </div>
        </form>
    </div>

    <style>
        .form-wrapper {
            text-align: center;
        }
        .centered-form {
            display: inline-block;
            text-align: left;
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            min-width: 400px;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input, select {
            padding: 8px;
            width: 250px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-actions {
            margin-top: 20px;
            text-align: center;
        }
        .btn {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-save {
            background: #4CAF50;
            color: white;
        }
        .btn-save:hover {
            background: #45a049;
        }
        .btn-cancel {
            background: #666;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            display: inline-block;
        }
        .btn-cancel:hover {
            background: #555;
        }
    </style>
{% endblock %}
