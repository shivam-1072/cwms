<!DOCTYPE html>
<html>
<head>
    <title>Add Expense</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .form-group { margin: 10px 0; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input, select, textarea { padding: 5px; width: 200px; }
        .btn { padding: 8px 15px; margin: 5px; cursor: pointer; }
        .btn-save { background: #4CAF50; color: white; border: none; }
        .btn-cancel { background: #666; color: white; text-decoration: none; padding: 8px 15px; }
    </style>
</head>
<body>
    <h1>Add Expense</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label>Site:</label>
            <select name="site" required>
                <option value="">Select Site</option>
                {% for site in sites %}
                    <option value="{{ site.id }}">{{ site.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Category:</label>
            <select name="category" required>
                <option value="material">Material</option>
                <option value="food">Food</option>
                <option value="fuel">Fuel</option>
                <option value="equipment">Equipment</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Description:</label>
            <textarea name="description" rows="3" cols="30" required></textarea>
        </div>
        <div class="form-group">
            <label>Amount (₹):</label>
            <input type="number" step="0.01" name="amount" required>
        </div>
        <div class="form-group">
            <label>Receipt:</label>
            <input type="file" name="receipt" accept="image/*,.pdf">
        </div>
        <div>
            <button type="submit" class="btn btn-save">Save</button>
            <a href="{% url 'expense_list' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</body>
</html>
