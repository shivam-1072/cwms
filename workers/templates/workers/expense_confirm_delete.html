<!DOCTYPE html>
<html>
<head>
    <title>Delete Expense</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .warning { background: #f44336; color: white; padding: 10px; }
        .btn { padding: 8px 15px; margin: 5px; cursor: pointer; }
        .btn-danger { background: #f44336; color: white; border: none; }
        .btn-cancel { background: #666; color: white; text-decoration: none; padding: 8px 15px; }
    </style>
</head>
<body>
    <h1>Delete Expense</h1>
    <div class="warning">
        <p>Are you sure you want to delete this expense?</p>
        <p><strong>{{ expense.get_category_display }}:</strong> ₹{{ expense.amount }} - {{ expense.description|truncatechars:50 }}</p>
        <p>This action cannot be undone.</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'expense_list' %}" class="btn-cancel">Cancel</a>
    </form>
</body>
</html>
