services:
  db:
    image: postgres:17
    container_name: construction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: construction_workforce_db
      POSTGRES_USER: construction_admin
      POSTGRES_PASSWORD: Cwmsadmin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction_admin -d construction_workforce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: construction-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=construction_workforce_db
      - DB_USER=construction_admin
      - DB_PASSWORD=Cwmsadmin
      - DB_PORT=5432
    volumes:
      - ./media:/app/media

volumes:
  postgres_data:
